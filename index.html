<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>نظام متابعة المرضى</title>

    <link rel="stylesheet" href="css/style.css">

    <!-- Barcode -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <!-- QR / Barcode Scanner -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
</head>

<body>

<header class="header">
    <h1>💊 نظام متابعة مرضى الصيدلية</h1>
</header>

<main class="container">

    <!-- إضافة مريض -->
    <section class="card">

        <h2>إضافة مريض جديد</h2>

        <input
            type="text"
            id="patientName"
            placeholder="اسم المريض"
        >

        <input
            type="tel"
            id="patientPhone"
            placeholder="رقم الهاتف"
        >

        <input
            type="date"
            id="patientBirthDate"
        >

        <textarea
            id="patientNotes"
            placeholder="ملاحظات"
        ></textarea>

        <button onclick="addPatient()">
            ➕ إضافة المريض
        </button>

    </section>


    <!-- البحث -->
    <section class="card">

        <h2>🔎 البحث عن مريض</h2>

        <input
            type="text"
            id="searchInput"
            placeholder="اكتب الاسم أو رقم الهاتف أو الباركود"
            oninput="searchPatients()"
        >

        <button onclick="startScanner()">
            📷 مسح الباركود
        </button>

        <div id="reader"></div>

        <div id="searchResults"></div>

    </section>


    <!-- طباعة الباركود -->
    <section
        class="card"
        id="barcodeSection"
        style="display:none;"
    >

        <h2>باركود المريض</h2>

        <p id="barcodePatientName"></p>

        <svg id="barcode"></svg>

        <button onclick="printBarcode()">
            🖨️ طباعة الباركود
        </button>

    </section>

</main>


<script src="js/app.js"></script>

</body>
</html>
