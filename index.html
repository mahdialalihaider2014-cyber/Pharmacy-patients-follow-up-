<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>نظام متابعة مرضى الصيدلية</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- إنشاء الباركود -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

    <!-- قارئ الباركود بالكاميرا -->
    <script
        src="https://unpkg.com/html5-qrcode"
        type="text/javascript"
    ></script>

</head>


<body>


<!-- =================================================
     الهيدر
================================================= -->

<header class="header">

    <div class="header-content">

        <div class="logo">
            💊
        </div>

        <div>

            <h1>
                نظام متابعة مرضى الصيدلية
            </h1>

            <p>
                إدارة ملفات المرضى والمتابعة
            </p>

        </div>

    </div>

</header>



<!-- =================================================
     المحتوى الرئيسي
================================================= -->

<main class="container">


    <!-- =================================================
         إضافة مريض
    ================================================= -->

    <section class="card">

        <div class="section-title">

            <span class="icon">
                👤
            </span>

            <div>

                <h2>
                    إضافة مريض جديد
                </h2>

                <p>
                    أدخل معلومات المريض الأساسية
                </p>

            </div>

        </div>


        <div class="form-grid">


            <!-- اسم المريض -->

            <div class="input-group">

                <label>
                    اسم المريض
                </label>

                <input
                    type="text"
                    id="patientName"
                    placeholder="مثال: محمد علي"
                >

            </div>


            <!-- رقم الهاتف -->

            <div class="input-group">

                <label>
                    رقم الهاتف
                </label>

                <input
                    type="tel"
                    id="patientPhone"
                    placeholder="مثال: 07701234567"
                >

            </div>


            <!-- تاريخ الميلاد -->

            <div class="input-group">

                <label>
                    تاريخ الميلاد
                </label>

                <input
                    type="date"
                    id="patientBirthDate"
                >

            </div>


            <!-- الملاحظات -->

            <div class="input-group full">

                <label>
                    ملاحظات
                </label>

                <textarea
                    id="patientNotes"
                    placeholder="ملاحظات عن المريض..."
                ></textarea>

            </div>

        </div>


        <!-- زر الإضافة -->

        <button
            type="button"
            class="primary-button"
            onclick="addPatient()"
        >

            ➕ إضافة المريض

        </button>

    </section>



    <!-- =================================================
         البحث
    ================================================= -->

    <section class="card">

        <div class="section-title">

            <span class="icon">
                🔎
            </span>

            <div>

                <h2>
                    البحث عن مريض
                </h2>

                <p>
                    البحث بالاسم أو رقم الهاتف أو رقم المريض
                </p>

            </div>

        </div>


        <!-- مربع البحث -->

        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="اكتب اسم المريض أو رقم الهاتف أو رقم المريض"
            >

        </div>



        <!-- =================================================
             أزرار الباركود
        ================================================= -->

        <div class="scanner-buttons">

            <button
                type="button"
                class="scan-button"
                onclick="startBarcodeScanner()"
            >

                📷 مسح الباركود

            </button>


            <button
                type="button"
                class="stop-button"
                onclick="stopBarcodeScanner()"
            >

                ✖ إيقاف الكاميرا

            </button>

        </div>



        <!-- =================================================
             الكاميرا
        ================================================= -->

        <div
            id="reader"
            class="reader"
        ></div>



        <!-- =================================================
             نتائج المرضى
        ================================================= -->

        <div
            id="patientsList"
            class="search-results"
        >

            <div class="no-result">

                جاري تحميل بيانات المرضى...

            </div>

        </div>

    </section>



    <!-- =================================================
         باركود المريض
    ================================================= -->

    <section
        class="card barcode-card"
        id="barcodeSection"
        style="display:none;"
    >

        <div class="section-title">

            <span class="icon">
                ▣
            </span>

            <div>

                <h2>
                    باركود المريض
                </h2>

                <p id="barcodePatientName"></p>

            </div>

        </div>


        <div class="barcode-container">

            <svg id="barcode"></svg>

        </div>


        <button
            type="button"
            class="primary-button"
            onclick="printBarcode()"
        >

            🖨️ طباعة الباركود

        </button>

    </section>


</main>



<!-- =================================================
     JavaScript
================================================= -->

<script src="app.js?v=4"></script>


</body>

</html>
