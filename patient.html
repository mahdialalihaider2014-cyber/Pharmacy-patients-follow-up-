<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ملف المريض</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- مكتبة الباركود -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

</head>


<body>


<!-- ==================================================
     الهيدر
================================================== -->

<header class="header">

    <div class="header-content">

        <div class="logo">
            💊
        </div>

        <div>

            <h1>
                ملف المريض
            </h1>

            <p>
                نظام متابعة مرضى الصيدلية
            </p>

        </div>

    </div>

</header>



<main class="container">


    <!-- ==================================================
         أزرار العودة
    ================================================== -->

    <div style="margin-bottom:20px;">

        <button
            class="primary-button"
            onclick="goBack()"
        >
            ← العودة إلى المرضى
        </button>

    </div>



    <!-- ==================================================
         بيانات المريض
    ================================================== -->

    <section class="card">

        <div class="section-title">

            <span class="icon">
                👤
            </span>

            <div>

                <h2>
                    بيانات المريض
                </h2>

                <p>
                    معلومات المريض الأساسية
                </p>

            </div>

        </div>


        <!-- رقم المريض -->

        <div
            style="
                background:#f1f5f4;
                padding:12px;
                border-radius:10px;
                margin-bottom:20px;
            "
        >

            <strong>
                رقم المريض:
            </strong>

            <span id="patientID">
                جاري التحميل...
            </span>

        </div>


        <div class="form-grid">


            <!-- الاسم -->

            <div class="input-group">

                <label>
                    اسم المريض
                </label>

                <input
                    type="text"
                    id="editName"
                >

            </div>


            <!-- الهاتف -->

            <div class="input-group">

                <label>
                    رقم الهاتف
                </label>

                <input
                    type="tel"
                    id="editPhone"
                >

            </div>


            <!-- تاريخ الميلاد -->

            <div class="input-group">

                <label>
                    تاريخ الميلاد
                </label>

                <input
                    type="date"
                    id="editBirthDate"
                >

            </div>


            <!-- الملاحظات -->

            <div class="input-group full">

                <label>
                    ملاحظات
                </label>

                <textarea
                    id="editNotes"
                    placeholder="ملاحظات عن المريض..."
                ></textarea>

            </div>


        </div>


        <button
            class="primary-button"
            onclick="updatePatient()"
        >

            💾 حفظ تعديلات المريض

        </button>


    </section>



    <!-- ==================================================
         باركود المريض
    ================================================== -->

    <section class="card">

        <div class="section-title">

            <span class="icon">
                ▣
            </span>

            <div>

                <h2>
                    باركود المريض
                </h2>

                <p>
                    يمكن استخدامه للبحث السريع عن الملف
                </p>

            </div>

        </div>


        <div
            style="
                text-align:center;
                padding:20px;
            "
        >

            <svg
                id="patientBarcode"
            ></svg>


            <div
                id="barcodeNumber"
                style="
                    margin-top:10px;
                    font-weight:bold;
                "
            ></div>

        </div>


        <button
            class="primary-button"
            onclick="printPatientBarcode()"
        >

            🖨️ طباعة الباركود

        </button>


    </section>



    <!-- ==================================================
         إضافة دواء
    ================================================== -->

    <section class="card">

        <div class="section-title">

            <span class="icon">
                💊
            </span>

            <div>

                <h2>
                    إضافة دواء
                </h2>

                <p>
                    تسجيل الدواء والعلاج الخاص بالمريض
                </p>

            </div>

        </div>


        <div class="form-grid">


            <!-- اسم الدواء -->

            <div class="input-group">

                <label>
                    اسم الدواء
                </label>

                <input
                    type="text"
                    id="medicineName"
                    placeholder="مثال: Metformin 500 mg"
                >

            </div>


            <!-- الجرعة -->

            <div class="input-group">

                <label>
                    الجرعة
                </label>

                <input
                    type="text"
                    id="medicineDose"
                    placeholder="مثال: حبة واحدة"
                >

            </div>


            <!-- مرات الاستخدام -->

            <div class="input-group">

                <label>
                    عدد مرات الاستخدام يوميًا
                </label>

                <input
                    type="number"
                    id="medicineTimes"
                    min="1"
                    placeholder="مثال: 2"
                >

            </div>


            <!-- الكمية -->

            <div class="input-group">

                <label>
                    الكمية
                </label>

                <input
                    type="number"
                    id="medicineQuantity"
                    min="0"
                    placeholder="مثال: 30"
                >

            </div>


            <!-- تاريخ الصرف -->

            <div class="input-group">

                <label>
                    تاريخ صرف الدواء
                </label>

                <input
                    type="date"
                    id="dispenseDate"
                >

            </div>


            <!-- عدد الأيام -->

            <div class="input-group">

                <label>
                    مدة العلاج بالأيام
                </label>

                <input
                    type="number"
                    id="medicineDays"
                    min="1"
                    placeholder="مثال: 30"
                >

            </div>


        </div>


        <button
            class="primary-button"
            onclick="addMedicine()"
        >

            ➕ إضافة الدواء

        </button>


    </section>



    <!-- ==================================================
         أدوية المريض
    ================================================== -->

    <section class="card">

        <div class="section-title">

            <span class="icon">
                📋
            </span>

            <div>

                <h2>
                    أدوية المريض
                </h2>

                <p>
                    جميع الأدوية المسجلة لهذا المريض
                </p>

            </div>

        </div>


        <div id="medicinesList">

            <div class="no-result">
                جاري تحميل الأدوية...
            </div>

        </div>


    </section>


</main>



<script>


/* =====================================================
   رابط Google Apps Script
===================================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbzkvBi5jiox12ObEG8RKoWgJM3hJrp1djQQpeopzKkrTmPAZvqdZUoUzT82etTZ11UG/exec";


/* =====================================================
   رقم المريض من الرابط
===================================================== */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const patientId =
    urlParams.get("id");


let currentPatient = null;


/* =====================================================
   عند فتح الصفحة
===================================================== */

document.addEventListener(
    "DOMContentLoaded",
    function () {


        if (!patientId) {

            alert(
                "لم يتم تحديد رقم المريض."
            );

            return;

        }


        loadPatient();

        loadMedicines();

    }
);


/* =====================================================
   جلب بيانات المريض
===================================================== */

async function loadPatient() {

    try {


        const response =
            await fetch(
                API_URL +
                "?action=patient&id=" +
                encodeURIComponent(
                    patientId
                )
            );


        const data =
            await response.json();


        console.log(
            "بيانات المريض:",
            data
        );


        if (!data.success) {

            alert(
                data.message ||
                "لم يتم العثور على المريض."
            );

            return;

        }


        currentPatient =
            data.patient;


        /* ---------------------------------------------
           عرض البيانات
        --------------------------------------------- */

        document.getElementById(
            "patientID"
        ).textContent =
            currentPatient.ID || "";


        document.getElementById(
            "editName"
        ).value =
            currentPatient.Name || "";


        document.getElementById(
            "editPhone"
        ).value =
            currentPatient.Phone || "";


        document.getElementById(
            "editBirthDate"
        ).value =
            formatDate(
                currentPatient.BirthDate
            );


        document.getElementById(
            "editNotes"
        ).value =
            currentPatient.Notes || "";


        /* ---------------------------------------------
           إنشاء الباركود
        --------------------------------------------- */

        createBarcode(
            currentPatient.ID
        );


    } catch (error) {

        console.error(error);


        alert(
            "❌ تعذر الاتصال بقاعدة بيانات المرضى."
        );

    }

}


/* =====================================================
   تنسيق التاريخ
===================================================== */

function formatDate(value) {

    if (!value) {

        return "";

    }


    const date =
        new Date(value);


    if (isNaN(date.getTime())) {

        return String(value)
            .substring(0, 10);

    }


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(2, "0");


    const day =
        String(
            date.getDate()
        ).padStart(2, "0");


    return (
        year +
        "-" +
        month +
        "-" +
        day
    );

}


/* =====================================================
   إنشاء باركود
===================================================== */

function createBarcode(id) {


    if (
        typeof JsBarcode ===
        "undefined"
    ) {

        return;

    }


    JsBarcode(
        "#patientBarcode",
        id,
        {

            format: "CODE128",

            displayValue: true,

            fontSize: 18,

            height: 90,

            width: 2,

            margin: 20

        }
    );


    document.getElementById(
        "barcodeNumber"
    ).textContent =
        id;

}


/* =====================================================
   تعديل بيانات المريض
===================================================== */

async function updatePatient() {


    const name =
        document.getElementById(
            "editName"
        ).value.trim();


    const phone =
        document.getElementById(
            "editPhone"
        ).value.trim();


    const birthDate =
        document.getElementById(
            "editBirthDate"
        ).value;


    const notes =
        document.getElementById(
            "editNotes"
        ).value.trim();


    if (!name) {

        alert(
            "يرجى إدخال اسم المريض."
        );

        return;

    }


    if (!phone) {

        alert(
            "يرجى إدخال رقم الهاتف."
        );

        return;

    }


    try {


        const url =
            API_URL +
            "?action=updatePatient" +
            "&id=" +
            encodeURIComponent(
                patientId
            ) +
            "&name=" +
            encodeURIComponent(
                name
            ) +
            "&phone=" +
            encodeURIComponent(
                phone
            ) +
            "&birthDate=" +
            encodeURIComponent(
                birthDate
            ) +
            "&notes=" +
            encodeURIComponent(
                notes
            );


        const response =
            await fetch(url);


        const data =
            await response.json();


        console.log(
            "تعديل المريض:",
            data
        );


        if (!data.success) {

            alert(
                "❌ " +
                (
                    data.message ||
                    "لم يتم التعديل."
                )
            );

            return;

        }


        alert(
            "✅ تم تحديث بيانات المريض بنجاح"
        );


        loadPatient();


    } catch (error) {

        console.error(error);


        alert(
            "❌ تعذر تحديث بيانات المريض."
        );

    }

}


/* =====================================================
   إضافة دواء
===================================================== */

async function addMedicine() {


    const medicineName =
        document.getElementById(
            "medicineName"
        ).value.trim();


    const dose =
        document.getElementById(
            "medicineDose"
        ).value.trim();


    const timesPerDay =
        document.getElementById(
            "medicineTimes"
        ).value;


    const quantity =
        document.getElementById(
            "medicineQuantity"
        ).value;


    const dispenseDate =
        document.getElementById(
            "dispenseDate"
        ).value;


    const days =
        document.getElementById(
            "medicineDays"
        ).value;


    if (!medicineName) {

        alert(
            "يرجى إدخال اسم الدواء."
        );

        return;

    }


    try {


        const url =
            API_URL +
            "?action=addMedicine" +
            "&patientId=" +
            encodeURIComponent(
                patientId
            ) +
            "&medicineName=" +
            encodeURIComponent(
                medicineName
            ) +
            "&dose=" +
            encodeURIComponent(
                dose
            ) +
            "&timesPerDay=" +
            encodeURIComponent(
                timesPerDay
            ) +
            "&quantity=" +
            encodeURIComponent(
                quantity
            ) +
            "&dispenseDate=" +
            encodeURIComponent(
                dispenseDate
            ) +
            "&days=" +
            encodeURIComponent(
                days
            );


        const response =
            await fetch(url);


        const data =
            await response.json();


        console.log(
            "إضافة الدواء:",
            data
        );


        if (!data.success) {

            alert(
                "❌ " +
                (
                    data.message ||
                    "لم تتم إضافة الدواء."
                )
            );

            return;

        }


        alert(
            "✅ تمت إضافة الدواء بنجاح"
        );


        /* ---------------------------------------------
           مسح الحقول
        --------------------------------------------- */

        document.getElementById(
            "medicineName"
        ).value = "";


        document.getElementById(
            "medicineDose"
        ).value = "";


        document.getElementById(
            "medicineTimes"
        ).value = "";


        document.getElementById(
            "medicineQuantity"
        ).value = "";


        document.getElementById(
            "medicineDays"
        ).value = "";


        /* ---------------------------------------------
           إعادة تحميل الأدوية
        --------------------------------------------- */

        loadMedicines();


    } catch (error) {

        console.error(error);


        alert(
            "❌ تعذر إضافة الدواء."
        );

    }

}


/* =====================================================
   جلب أدوية المريض
===================================================== */

async function loadMedicines() {


    try {


        const response =
            await fetch(
                API_URL +
                "?action=medicines&patientId=" +
                encodeURIComponent(
                    patientId
                )
            );


        const data =
            await response.json();


        console.log(
            "الأدوية:",
            data
        );


        displayMedicines(
            Array.isArray(data)
                ? data
                : []
        );


    } catch (error) {

        console.error(error);


        document.getElementById(
            "medicinesList"
        ).innerHTML = `

            <div class="no-result">

                ❌ تعذر تحميل الأدوية.

            </div>

        `;

    }

}


/* =====================================================
   عرض الأدوية
===================================================== */

function displayMedicines(
    medicines
) {


    const container =
        document.getElementById(
            "medicinesList"
        );


    if (
        !medicines ||
        medicines.length === 0
    ) {


        container.innerHTML = `

            <div class="no-result">

                💊 لا توجد أدوية مسجلة لهذا المريض.

            </div>

        `;


        return;

    }


    container.innerHTML =
        medicines.map(
            function (medicine) {


                return `

                    <div
                        class="patient-result"
                        style="
                            display:block;
                            margin-bottom:15px;
                        "
                    >

                        <h3>
                            💊
                            ${escapeHTML(
                                medicine.MedicineName
                            )}
                        </h3>


                        <p>
                            <strong>
                                الجرعة:
                            </strong>

                            ${escapeHTML(
                                medicine.Dose
                            )}
                        </p>


                        <p>
                            <strong>
                                مرات الاستخدام:
                            </strong>

                            ${escapeHTML(
                                medicine.TimesPerDay
                            )}
                            مرة يوميًا
                        </p>


                        <p>
                            <strong>
                                الكمية:
                            </strong>

                            ${escapeHTML(
                                medicine.Quantity
                            )}
                        </p>


                        <p>
                            <strong>
                                تاريخ الصرف:
                            </strong>

                            ${escapeHTML(
                                formatDate(
                                    medicine.DispenseDate
                                )
                            )}
                        </p>


                        <p>
                            <strong>
                                مدة العلاج:
                            </strong>

                            ${escapeHTML(
                                medicine.Days
                            )}
                            يوم
                        </p>


                        <p>
                            <strong>
                                📅 تاريخ المتابعة:
                            </strong>

                            ${escapeHTML(
                                formatDate(
                                    medicine.FollowUpDate
                                )
                            )}
                        </p>

                    </div>

                `;

            }
        ).join("");

}


/* =====================================================
   طباعة الباركود
===================================================== */

function printPatientBarcode() {


    const barcode =
        document.getElementById(
            "patientBarcode"
        );


    const id =
        currentPatient
            ? currentPatient.ID
            : patientId;


    const name =
        currentPatient
            ? currentPatient.Name
            : "";


    if (!barcode) {

        return;

    }


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    if (!printWindow) {

        alert(
            "يرجى السماح بفتح نافذة الطباعة."
        );

        return;

    }


    printWindow.document.write(`

        <!DOCTYPE html>

        <html
            lang="ar"
            dir="rtl"
        >

        <head>

            <meta charset="UTF-8">

            <title>
                باركود المريض
            </title>

            <style>

                body {

                    text-align:center;

                    font-family:Arial;

                    padding:40px;

                }

                svg {

                    max-width:100%;

                }

            </style>

        </head>

        <body>

            <h2>
                ${escapeHTML(name)}
            </h2>

            <p>
                رقم المريض:
                ${escapeHTML(id)}
            </p>

            ${barcode.outerHTML}

            <script>

                window.onload =
                    function () {

                        window.print();

                    };

            <\/script>

        </body>

        </html>

    `);


    printWindow.document.close();

}


/* =====================================================
   العودة
===================================================== */

function goBack() {

    window.location.href =
        "index.html";

}


/* =====================================================
   حماية النصوص
===================================================== */

function escapeHTML(value) {

    return String(
        value || ""
    )

        .replace(
            /&/g,
            "&amp;"
        )

        .replace(
            /</g,
            "&lt;"
        )

        .replace(
            />/g,
            "&gt;"
        )

        .replace(
            /"/g,
            "&quot;"
        )

        .replace(
            /'/g,
            "&#039;"
        );

}

</script>


</body>

</html>
