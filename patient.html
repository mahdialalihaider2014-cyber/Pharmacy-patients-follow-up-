<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>ملف المريض</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- إنشاء الباركود -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.6/dist/JsBarcode.all.min.js"></script>

</head>


<body>


<header class="header">

    <div class="header-content">

        <div class="logo">
            💊
        </div>

        <div>

            <h1>
                ملف المريض
            </h1>

            <p>
                متابعة بيانات وأدوية المريض
            </p>

        </div>

    </div>

</header>



<main class="container">


    <!-- =========================
         العودة
    ========================= -->

    <button
        class="primary-button"
        onclick="goBack()"
    >

        ← العودة إلى قائمة المرضى

    </button>



    <!-- =========================
         بيانات المريض
    ========================= -->

    <section class="card">

        <div class="section-title">

            <span class="icon">
                👤
            </span>

            <div>

                <h2>
                    معلومات المريض
                </h2>

                <p>
                    بيانات المريض الأساسية
                </p>

            </div>

        </div>


        <div class="form-grid">


            <div class="input-group">

                <label>
                    رقم المريض
                </label>

                <input
                    id="patientID"
                    type="text"
                    readonly
                >

            </div>


            <div class="input-group">

                <label>
                    اسم المريض
                </label>

                <input
                    id="patientName"
                    type="text"
                    placeholder="اسم المريض"
                >

            </div>


            <div class="input-group">

                <label>
                    رقم الهاتف
                </label>

                <input
                    id="patientPhone"
                    type="tel"
                    placeholder="رقم الهاتف"
                >

            </div>


            <div class="input-group">

                <label>
                    تاريخ الميلاد
                </label>

                <input
                    id="patientBirthDate"
                    type="date"
                >

            </div>


            <div class="input-group full">

                <label>
                    الملاحظات
                </label>

                <textarea
                    id="patientNotes"
                    placeholder="ملاحظات عن المريض..."
                ></textarea>

            </div>

        </div>


        <button
            class="primary-button"
            onclick="updatePatient()"
        >

            💾 حفظ تعديلات المريض

        </button>

    </section>



    <!-- =========================
         باركود المريض
    ========================= -->

    <section class="card barcode-card">

        <div class="section-title">

            <span class="icon">
                ▣
            </span>

            <div>

                <h2>
                    باركود المريض
                </h2>

                <p>
                    استخدمه للبحث السريع عن المريض
                </p>

            </div>

        </div>


        <div class="barcode-container">

            <svg id="patientBarcode"></svg>

        </div>


        <button
            class="primary-button"
            onclick="printBarcode()"
        >

            🖨️ طباعة الباركود

        </button>

    </section>



    <!-- =========================
         إضافة دواء
    ========================= -->

    <section class="card">

        <div class="section-title">

            <span class="icon">
                💊
            </span>

            <div>

                <h2>
                    إضافة دواء
                </h2>

                <p>
                    تسجيل الدواء وموعد المتابعة
                </p>

            </div>

        </div>


        <div class="form-grid">


            <div class="input-group">

                <label>
                    اسم الدواء
                </label>

                <input
                    id="medicineName"
                    type="text"
                    placeholder="مثال: Metformin 500mg"
                >

            </div>


            <div class="input-group">

                <label>
                    الجرعة
                </label>

                <input
                    id="medicineDose"
                    type="text"
                    placeholder="مثال: حبة واحدة"
                >

            </div>


            <div class="input-group">

                <label>
                    عدد مرات الاستخدام يومياً
                </label>

                <input
                    id="medicineTimes"
                    type="number"
                    min="1"
                    placeholder="مثال: 2"
                >

            </div>


            <div class="input-group">

                <label>
                    الكمية
                </label>

                <input
                    id="medicineQuantity"
                    type="number"
                    min="1"
                    placeholder="مثال: 60"
                >

            </div>


            <div class="input-group">

                <label>
                    تاريخ صرف الدواء
                </label>

                <input
                    id="dispenseDate"
                    type="date"
                >

            </div>


            <div class="input-group">

                <label>
                    عدد أيام العلاج
                </label>

                <input
                    id="medicineDays"
                    type="number"
                    min="1"
                    placeholder="مثال: 30"
                    oninput="calculateFollowUp()"
                >

            </div>


            <div class="input-group full">

                <label>
                    موعد المتابعة
                </label>

                <input
                    id="followUpDate"
                    type="date"
                    readonly
                >

            </div>


        </div>


        <button
            class="primary-button"
            onclick="addMedicine()"
        >

            ➕ إضافة الدواء

        </button>

    </section>



    <!-- =========================
         قائمة الأدوية
    ========================= -->

    <section class="card">

        <div class="section-title">

            <span class="icon">
                📋
            </span>

            <div>

                <h2>
                    أدوية المريض
                </h2>

                <p>
                    الأدوية المسجلة لهذا المريض
                </p>

            </div>

        </div>


        <div id="medicinesList">

            <div class="no-result">

                جارٍ تحميل الأدوية...

            </div>

        </div>

    </section>


</main>



<script>


/* =========================================
   رابط Google Apps Script الصحيح
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxpciZPGC7wvRK-0hAYiZP1PETQh4m5hnWtgHGvCk56roAOtCPcGCR_pWhhek2iSfKB/exec";


/* =========================================
   قراءة رقم المريض من الرابط
========================================= */

const urlParams =
    new URLSearchParams(
        window.location.search
    );


const patientID =
    urlParams.get("id");


/* =========================================
   عند فتح الصفحة
========================================= */

document.addEventListener(
    "DOMContentLoaded",
    function () {

        if (!patientID) {

            alert(
                "لم يتم تحديد رقم المريض."
            );

            return;

        }


        document.getElementById(
            "patientID"
        ).value = patientID;


        setToday();

        loadPatient();

        loadMedicines();

    }
);


/* =========================================
   تحميل بيانات المريض
========================================= */

async function loadPatient() {

    try {

        const response =
            await fetch(
                API_URL +
                "?action=patient&id=" +
                encodeURIComponent(
                    patientID
                )
            );


        const data =
            await response.json();


        console.log(
            "بيانات المريض:",
            data
        );


        if (!data.success) {

            alert(
                data.message ||
                "تعذر العثور على المريض."
            );

            return;

        }


        const patient =
            data.patient;


        document.getElementById(
            "patientID"
        ).value =
            patient.ID || "";


        document.getElementById(
            "patientName"
        ).value =
            patient.Name || "";


        document.getElementById(
            "patientPhone"
        ).value =
            patient.Phone || "";


        document.getElementById(
            "patientBirthDate"
        ).value =
            formatDateForInput(
                patient.BirthDate
            );


        document.getElementById(
            "patientNotes"
        ).value =
            patient.Notes || "";


        /*
        إنشاء باركود المريض
        */

        JsBarcode(
            "#patientBarcode",
            String(patient.ID),
            {

                format: "CODE128",

                width: 2,

                height: 80,

                displayValue: true,

                fontSize: 18,

                margin: 10

            }
        );


        document.title =
            "ملف المريض - " +
            (patient.Name || "");


    } catch (error) {

        console.error(
            "خطأ:",
            error
        );


        alert(
            "تعذر الاتصال بقاعدة بيانات المرضى."
        );

    }

}


/* =========================================
   تعديل بيانات المريض
========================================= */

async function updatePatient() {


    const name =
        document.getElementById(
            "patientName"
        ).value.trim();


    const phone =
        document.getElementById(
            "patientPhone"
        ).value.trim();


    const birthDate =
        document.getElementById(
            "patientBirthDate"
        ).value;


    const notes =
        document.getElementById(
            "patientNotes"
        ).value.trim();


    if (!name) {

        alert(
            "يرجى إدخال اسم المريض."
        );

        return;

    }


    try {


        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    body: JSON.stringify({

                        action:
                            "updatePatient",

                        id:
                            patientID,

                        name:
                            name,

                        phone:
                            phone,

                        birthDate:
                            birthDate,

                        notes:
                            notes

                    })

                }
            );


        const data =
            await response.json();


        console.log(
            "تعديل المريض:",
            data
        );


        if (!data.success) {

            alert(
                data.message ||
                "لم يتم حفظ التعديل."
            );

            return;

        }


        alert(
            "✅ تم حفظ تعديلات المريض بنجاح."
        );


    } catch (error) {

        console.error(
            error
        );


        alert(
            "تعذر الاتصال بقاعدة البيانات."
        );

    }

}


/* =========================================
   وضع تاريخ اليوم
========================================= */

function setToday() {

    const today =
        new Date();


    const year =
        today.getFullYear();


    const month =
        String(
            today.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            today.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "dispenseDate"
    ).value =
        `${year}-${month}-${day}`;

}


/* =========================================
   حساب موعد المتابعة
========================================= */

function calculateFollowUp() {


    const dispenseDate =
        document.getElementById(
            "dispenseDate"
        ).value;


    const days =
        Number(
            document.getElementById(
                "medicineDays"
            ).value
        );


    if (
        !dispenseDate ||
        !days
    ) {

        document.getElementById(
            "followUpDate"
        ).value = "";

        return;

    }


    const date =
        new Date(
            dispenseDate +
            "T00:00:00"
        );


    date.setDate(
        date.getDate() +
        days
    );


    const year =
        date.getFullYear();


    const month =
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        );


    const day =
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        );


    document.getElementById(
        "followUpDate"
    ).value =
        `${year}-${month}-${day}`;

}


/* =========================================
   إضافة دواء
========================================= */

async function addMedicine() {


    const medicineName =
        document.getElementById(
            "medicineName"
        ).value.trim();


    const dose =
        document.getElementById(
            "medicineDose"
        ).value.trim();


    const timesPerDay =
        document.getElementById(
            "medicineTimes"
        ).value;


    const quantity =
        document.getElementById(
            "medicineQuantity"
        ).value;


    const dispenseDate =
        document.getElementById(
            "dispenseDate"
        ).value;


    const days =
        document.getElementById(
            "medicineDays"
        ).value;


    if (!medicineName) {

        alert(
            "يرجى إدخال اسم الدواء."
        );

        return;

    }


    try {


        const response =
            await fetch(
                API_URL,
                {

                    method: "POST",

                    body: JSON.stringify({

                        action:
                            "addMedicine",

                        patientId:
                            patientID,

                        medicineName:
                            medicineName,

                        dose:
                            dose,

                        timesPerDay:
                            timesPerDay,

                        quantity:
                            quantity,

                        dispenseDate:
                            dispenseDate,

                        days:
                            days

                    })

                }
            );


        const data =
            await response.json();


        console.log(
            "إضافة الدواء:",
            data
        );


        if (!data.success) {

            alert(
                data.message ||
                "لم تتم إضافة الدواء."
            );

            return;

        }


        alert(
            "✅ تمت إضافة الدواء بنجاح."
        );


        /*
        تنظيف الحقول
        */

        document.getElementById(
            "medicineName"
        ).value = "";


        document.getElementById(
            "medicineDose"
        ).value = "";


        document.getElementById(
            "medicineTimes"
        ).value = "";


        document.getElementById(
            "medicineQuantity"
        ).value = "";


        document.getElementById(
            "medicineDays"
        ).value = "";


        document.getElementById(
            "followUpDate"
        ).value = "";


        /*
        إعادة تحميل الأدوية
        */

        loadMedicines();


    } catch (error) {

        console.error(
            error
        );


        alert(
            "تعذر الاتصال بقاعدة البيانات."
        );

    }

}


/* =========================================
   تحميل أدوية المريض
========================================= */

async function loadMedicines() {


    const container =
        document.getElementById(
            "medicinesList"
        );


    try {


        const response =
            await fetch(
                API_URL +
                "?action=medicines&patientId=" +
                encodeURIComponent(
                    patientID
                )
            );


        const medicines =
            await response.json();


        console.log(
            "الأدوية:",
            medicines
        );


        if (
            !Array.isArray(
                medicines
            )
        ) {

            container.innerHTML = `

                <div class="no-result">

                    لا توجد أدوية مسجلة.

                </div>

            `;

            return;

        }


        if (
            medicines.length === 0
        ) {

            container.innerHTML = `

                <div class="no-result">

                    💊 لا توجد أدوية مسجلة لهذا المريض.

                </div>

            `;

            return;

        }


        container.innerHTML =
            medicines.map(
                function (medicine) {

                    return `

                        <div class="patient-result">

                            <div class="patient-info">

                                <strong>

                                    💊
                                    ${escapeHTML(
                                        medicine.MedicineName
                                    )}

                                </strong>


                                <p>

                                    الجرعة:
                                    ${escapeHTML(
                                        medicine.Dose ||
                                        "غير محددة"
                                    )}

                                </p>


                                <p>

                                    الاستخدام:
                                    ${escapeHTML(
                                        medicine.TimesPerDay ||
                                        "غير محدد"
                                    )}
                                    مرة يومياً

                                </p>


                                <p>

                                    الكمية:
                                    ${escapeHTML(
                                        medicine.Quantity ||
                                        "غير محددة"
                                    )}

                                </p>


                                <p>

                                    تاريخ الصرف:
                                    ${formatDisplayDate(
                                        medicine.DispenseDate
                                    )}

                                </p>


                                <p>

                                    موعد المتابعة:
                                    ${formatDisplayDate(
                                        medicine.FollowUpDate
                                    )}

                                </p>

                            </div>

                        </div>

                    `;

                }
            )
            .join("");


    } catch (error) {

        console.error(
            error
        );


        container.innerHTML = `

            <div class="no-result">

                ❌ تعذر تحميل الأدوية.

            </div>

        `;

    }

}


/* =========================================
   طباعة باركود المريض
========================================= */

function printBarcode() {


    const barcode =
        document.getElementById(
            "patientBarcode"
        ).outerHTML;


    const name =
        document.getElementById(
            "patientName"
        ).value;


    const id =
        document.getElementById(
            "patientID"
        ).value;


    const printWindow =
        window.open(
            "",
            "_blank"
        );


    if (!printWindow) {

        alert(
            "يرجى السماح بالنوافذ المنبثقة للطباعة."
        );

        return;

    }


    printWindow.document.write(`

        <!DOCTYPE html>

        <html
            lang="ar"
            dir="rtl"
        >

        <head>

            <meta charset="UTF-8">

            <title>
                باركود المريض
            </title>

            <style>

                body {

                    text-align: center;

                    font-family: Arial;

                    padding: 30px;

                }

                svg {

                    max-width: 350px;

                }

            </style>

        </head>


        <body>

            <h2>
                ${escapeHTML(name)}
            </h2>

            <p>
                رقم المريض:
                ${escapeHTML(id)}
            </p>

            ${barcode}


            <script>

                window.onload =
                function () {

                    window.print();

                };

            <\/script>


        </body>

        </html>

    `);


    printWindow.document.close();

}


/* =========================================
   العودة إلى الصفحة الرئيسية
========================================= */

function goBack() {

    window.location.href =
        "index.html";

}


/* =========================================
   التاريخ إلى input date
========================================= */

function formatDateForInput(value) {


    if (!value) {

        return "";

    }


    /*
    إذا كان التاريخ أصلاً
    بالشكل YYYY-MM-DD
    */

    const stringValue =
        String(value);


    const match =
        stringValue.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (match) {

        return (
            match[1] +
            "-" +
            match[2] +
            "-" +
            match[3]
        );

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "";

    }


    return (
        date.getFullYear() +
        "-" +
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "-" +
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        )
    );

}


/* =========================================
   عرض التاريخ
========================================= */

function formatDisplayDate(value) {


    if (!value) {

        return "غير محدد";

    }


    const stringValue =
        String(value);


    const match =
        stringValue.match(
            /^(\d{4})-(\d{2})-(\d{2})/
        );


    if (match) {

        return (
            match[3] +
            "/" +
            match[2] +
            "/" +
            match[1]
        );

    }


    const date =
        new Date(value);


    if (
        isNaN(
            date.getTime()
        )
    ) {

        return "غير محدد";

    }


    return (
        String(
            date.getDate()
        ).padStart(
            2,
            "0"
        ) +
        "/" +
        String(
            date.getMonth() + 1
        ).padStart(
            2,
            "0"
        ) +
        "/" +
        date.getFullYear()
    );

}


/* =========================================
   حماية النصوص
========================================= */

function escapeHTML(value) {

    return String(
        value || ""
    )

    .replace(
        /&/g,
        "&amp;"
    )

    .replace(
        /</g,
        "&lt;"
    )

    .replace(
        />/g,
        "&gt;"
    )

    .replace(
        /"/g,
        "&quot;"
    )

    .replace(
        /'/g,
        "&#039;"
    );

}


</script>


</body>

</html>
